@if (item.hasValue()) {
  <p>
    <app-sprite [name]="item.value().item.icon_sprite" />
    {{ item.value().item.name }}

  </p>

  @let catchable = item.value()?.fish || item.value()?.bug;

  @if (catchable) {
    <app-catchable-information [catchable]="catchable" />
  }

  {{ item.value() | json }}
}
